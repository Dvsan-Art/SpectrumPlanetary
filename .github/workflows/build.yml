name: Build VST3

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    name: Build for Windows (VST3)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build

      - name: Build project
        run: cmake --build build --config Release

      - name: Prepare Artifact
        run: |
          mkdir staging
          Copy-Item -Path "build\SpectrumPlanetary_artefacts\Release\VST3\Spectrum Planetary.vst3" -Destination "staging\" -Recurse

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-Planetary-VST3
          path: staging/
