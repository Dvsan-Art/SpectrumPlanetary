name: Compilar VST3
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Descargar WebView2
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "$env:RUNNER_TEMP\wv2"
      - name: Configurar
        shell: pwsh
        run: |
          $p = Get-ChildItem "$env:RUNNER_TEMP\wv2" -Directory | Select-Object -First 1
          cmake -B build -G "Visual Studio 17 2022" -A x64 "-DWebView2_INCLUDE_DIR=$($p.FullName)\build\native\include" "-DWebView2_LIBRARY=$($p.FullName)\build\native\x64\WebView2LoaderStatic.lib"
      - name: Compilar
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: Spectrum-Planetary-VST3
          path: build/SpectrumPlanetary_artefacts/Release/VST3/
